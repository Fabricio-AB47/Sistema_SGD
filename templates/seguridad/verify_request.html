<!doctype html>
<html>
<body>
  <h1>Verificar correo</h1>
  {% if messages %}{% for m in messages %}<div>{{ m }}</div>{% endfor %}{% endif %}
  <p>Correo: {{ usuario.correo }}</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Enviar correo de verificación</button>
  </form>
  <form method="post" action="{% url 'resend_verification' %}">
    {% csrf_token %}
    <button type="submit">Reenviar</button>
  </form>
</body>
</html>
